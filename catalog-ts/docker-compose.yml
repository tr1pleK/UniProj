services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: catalog
    ports:
      - "5433:5432"
    volumes:
      # init.sql выполняется автоматически при первом запуске контейнера:
      # создаёт таблицы и наполняет их тестовыми данными
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
